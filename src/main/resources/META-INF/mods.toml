modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="${mod_authors}"

# 硬依赖:forge + minecraft
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 可选联动(全部 optional + 能力探测,无对应模组时降级)
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="oculus"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="embeddium"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
