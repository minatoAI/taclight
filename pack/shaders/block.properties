# TacLight Shaders material classification (Iris block.properties mechanism).
# ASCII only - same jcpp preprocessing rule as shaders.properties.
# Consumed by gbuffers_terrain (mc_Entity.x) -> colortex3.a occlusion factor:
#   block.2001 = soft foliage (occlusion 0.25): grasses, ferns, flowers, crops,
#                vines, kelp - cutout cross-models; full occlusion turned
#                grass-covered ground pitch black (M1 field evidence).
#   block.2002 = leaves (occlusion 0.60): dense but translucent canopy.
#   everything else = solid (occlusion 1.0, default).
# Target version: MC 1.20.1 (grass is still "minecraft:grass" here; the
# rename to short_grass happens in 1.20.3).
block.2001=minecraft:grass minecraft:tall_grass minecraft:fern minecraft:large_fern minecraft:dead_bush minecraft:sweet_berry_bush minecraft:sugar_cane minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots minecraft:nether_wart minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium minecraft:azure_bluet minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip minecraft:pink_tulip minecraft:oxeye_daisy minecraft:cornflower minecraft:lily_of_the_valley minecraft:wither_rose minecraft:torchflower minecraft:sunflower minecraft:lilac minecraft:rose_bush minecraft:peony minecraft:pink_petals minecraft:vine minecraft:glow_lichen minecraft:hanging_roots minecraft:weeping_vines minecraft:weeping_vines_plant minecraft:twisting_vines minecraft:twisting_vines_plant minecraft:cave_vines minecraft:cave_vines_plant minecraft:kelp minecraft:kelp_plant minecraft:seagrass minecraft:tall_seagrass
block.2002=minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves minecraft:mangrove_leaves minecraft:cherry_leaves minecraft:azalea_leaves minecraft:flowering_azalea_leaves
