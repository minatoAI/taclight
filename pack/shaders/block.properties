# TacLight Shaders material classification (Iris block.properties mechanism).
# ASCII only - same jcpp preprocessing rule as shaders.properties.
# Consumed by gbuffers_terrain (mc_Entity.x) -> colortex3.a occlusion factor:
#   block.2001 = soft occlusion (occlusion 0.25): cross-model foliage (grasses,
#                ferns, flowers, crops, vines, kelp) + the partial-height blocks
#                that the Java voxel path tiers as CODE_VEG (bottom-half slabs,
#                bottom-half stairs, snow layers 3-7).
#   block.2002 = leaves (occlusion 0.60): dense but translucent canopy.
#   block.2003 = transparent (occlusion 0.0): thin plates and collision-less
#                blocks that the Java voxel path tiers as CODE_EMPTY (snow layers
#                1-2, carpets, tripwire, lily pad, rails, pressure plates,
#                trapdoors, redstone components, cobweb).
#   everything else = solid (occlusion 1.0, default) - which is also what the
#                Java path returns for full blocks (farmland/dirt_path 15/16,
#                fences/walls 1.5 collision height, snow layer 8).
# 2026-09-18: block.2003 added in the snow-diamond-lattice root-cause round; the
#   Java side no longer defaults non-listed blocks to solid - it measures the
#   real shapes (see dev.taclight.channel.VoxelClassifier, criterion C:
#   guard 1 empty collision shape -> EMPTY, guard 2 collision maxY > 1.0 -> SOLID,
#   otherwise tiers by the OCCLUSION shape solid fraction).
# STATE FILTER SYNTAX: Oculus 1.8.0 expects `namespace:name:key=value`
#   (verified by executing the shipped BlockEntry.parse). The `name[key=value]`
#   form is NOT supported: it silently resolves to the non-existent block
#   `minecraft:minecraft`. Unknown but well-formed ids are skipped silently;
#   malformed ids throw and abort the pack load.
# LIMIT: this file can only name vanilla ids. The Java voxel path reads runtime
#   collision+occlusion shapes, so it also covers modded blocks and unlisted
#   vanilla blocks -> the SSO fallback (!voxel off) still drifts there. The Java
#   voxel path is the primary path.
# Target version: MC 1.20.1 (grass is still "minecraft:grass" here; the
# rename to short_grass happens in 1.20.3).
